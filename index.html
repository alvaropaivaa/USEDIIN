<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#F3F5F4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0D0C" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dinn" />
    <meta name="description" content="Dinn — finanças pessoais: receitas, despesas, contas, cartões, limites de gastos, metas e dívidas, com avisos de vencimento no celular." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon-64.png" type="image/png" sizes="64x64" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400..700&family=Plus+Jakarta+Sans:wght@700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <title>Dinn</title>
    <script>
      // Tema antes da primeira pintura (o App confirma depois). O iPhone guarda a cor do fundo ao abrir o
      // app instalado e pinta com ela a faixa de baixo; sem isto, quem usa o tema escuro ficava com a faixa clara.
      try {
        var saved = JSON.parse(localStorage.getItem('jurospro-gestao') || '{}')
        var theme = saved && saved.state && saved.state.settings && saved.state.settings.theme
        var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
